plugins {
    id 'com.android.application'
}

// Clé de publication (upload key Google Play) : android/keystore.properties, jamais dans Git.
// Absente : la release est signée avec la clé de debug (installable, mais refusée par Play).
def keystoreProps = new Properties()
def keystoreFile = rootProject.file('keystore.properties')
if (keystoreFile.exists()) keystoreFile.withInputStream { keystoreProps.load(it) }

android {
    namespace 'com.ubear.game'
    compileSdk 36
    ndkVersion '27.2.12479018'

    defaultConfig {
        applicationId 'com.ubear.game'
        minSdk 24
        targetSdk 36
        versionCode 1          // à augmenter à chaque envoi sur Play
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a', 'x86_64' }
        // NativeActivity ne charge que libubear.so : la STL doit être liée dedans.
        externalNativeBuild { cmake { arguments '-DANDROID_STL=c++_static' } }
    }

    signingConfigs {
        release {
            if (keystoreProps) {
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }

    buildTypes {
        release {
            // Pas de R8 : les classes Java ne sont appelées que depuis le C++ (JNI), il les supprimerait.
            minifyEnabled false
            signingConfig keystoreProps ? signingConfigs.release : signingConfigs.debug
        }
    }

    // Sources partagées avec le reste du projet (pas de copie)
    sourceSets {
        main {
            manifest.srcFile '../AndroidManifest.xml'
            java.srcDirs = ['../java']
            assets.srcDirs = ['../../assets']
        }
    }
    androidResources {
        ignoreAssetsPattern '!.svn:!.git:.*:!CVS:!thumbs.db:!*~:!ubear_save*.txt:<dir>new-assets'
    }

    externalNativeBuild {
        cmake {
            path '../../CMakeLists.txt'
            version '3.22.1'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // .so compressés dans l'APK (ancien android:extractNativeLibs="true")
    packaging { jniLibs { useLegacyPackaging true } }
}

dependencies {
    implementation 'com.android.billingclient:billing:9.1.0'
    // Aligne kotlin-stdlib et les anciens -jdk7/-jdk8 tirés par les dépendances (sinon classes en double)
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.8.22')
}
