# =============================================================================
# codemagic.yaml - Ubear iOS : CMake + Xcode, pas Flutter.
#
# Ce fichier doit être placé à la RACINE du dépôt Ubear,
# sur la branche principale, puis il faut cliquer sur
# "Check for configuration files" dans Codemagic.
#
# Sections de l'éditeur supposées vides ou laissées par défaut :
# Build triggers, Environment variables, Dependency caching, Tests,
# Notifications. Si tu y avais configuré quelque chose, il faut l'ajouter ici.
# =============================================================================

workflows:
  ubear-ios:
    name: Ubear iOS

    # "Max build duration" de l'éditeur : 60 minutes.
    max_build_duration: 60

    # "Run build on" de l'éditeur : macOS M2.
    instance_type: mac_mini_m2

    # -------------------------------------------------------------------------
    # Clé API App Store Connect
    # -------------------------------------------------------------------------
    # La valeur doit être le NOM EXACT de la clé enregistrée dans Codemagic
    # (Settings > Integrations > Developer Portal / App Store Connect).
    # Dans l'éditeur, elle s'affiche sous le nom
    # "codemagic api key app store admin (Key: 87MW9UNZ54)".
    # Le nom est la partie AVANT "(Key: ...)". Respecte les majuscules,
    # les minuscules et les espaces.
    integrations:
      app_store_connect: codemagic api key app store admin

    environment:
      # Versions pour Ubear (CMake, pas Flutter).
      xcode: latest        # "Latest (26.6)"

      # Variables utilisées par les scripts.
      vars:
        BUNDLE_ID: com.ubear.game
        XCODE_PROJECT: build/ios/ubear.xcodeproj
        XCODE_SCHEME: ubear

      # -----------------------------------------------------------------------
      # Signature iOS (optionnel)
      # -----------------------------------------------------------------------
      # Le certificat et le profil sont pris dans
      # Settings > codemagic.yaml settings > Code signing identities,
      # par leur nom ("Reference name"). Les noms doivent être recopiés
      # EXACTEMENT, avec les mêmes espaces, majuscules et minuscules.
      # Codemagic les installe sur la machine de build, puis l'étape
      # "xcode-project use-profiles" les applique au projet Xcode.
      #
      # - Certificat "certificat distribution 1.5" : type production, équipe
      #   Fabien BOURRUT, expire le 09/04/2027.
      # - Profil "certificat fab distribution webunic" : type app_store, équipe
      #   Fabien BOURRUT, Bundle ID "*", expire le 09/04/2027.
      #
      # ATTENTION : ce profil est un profil WILDCARD (Bundle ID "*"). Il peut
      # signer n'importe quelle app de l'équipe et l'envoyer sur TestFlight,
      # MAIS seulement si l'app n'utilise aucune capability qui demande un
      # Bundle ID explicite : Push Notifications, Sign in with Apple,
      # In-App Purchase, iCloud, App Groups, Associated Domains...
      # Si l'app en utilise une, il faut un profil App Store créé pour son
      # Bundle ID explicite (developer.apple.com > Profiles), ajouté dans
      # Code signing identities avec "Fetch profiles".
      #
      # Dans tous les cas, le Bundle ID du projet (PRODUCT_BUNDLE_IDENTIFIER
      # dans ios/ubear.xcodeproj) doit être exactement celui de l'app créée
      # dans App Store Connect.
      # Décommente pour ajouter la signature :
      # ios_signing:
      #   certificates:
      #     - certificat distribution 1.5
      #   provisioning_profiles:
      #     - certificat fab distribution webunic

    # -------------------------------------------------------------------------
    # Déclenchement
    # -------------------------------------------------------------------------
    # Aucun déclencheur : les builds se lancent à la main depuis Codemagic,
    # comme un workflow de l'éditeur sans "Build triggers".
    # Pour lancer un build à chaque push sur master, décommente ce bloc :
    #
    # triggering:
    #   events:
    #     - push
    #   branch_patterns:
    #     - pattern: master
    #       include: true

    scripts:
      - name: Outils
        script: |
          set -e
          brew list cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
          xcodebuild -version

      - name: Projet Xcode
        script: |
          set -e
          cmake -G Xcode -S "$CM_BUILD_DIR" -B "$CM_BUILD_DIR/build/ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release
          xcodebuild -project "$XCODE_PROJECT" -list

      # Applique au projet Xcode le certificat et le profil récupérés grâce à
      # "ios_signing". Cette étape remplace la signature automatique de l'éditeur.
      - name: Signature si les certificats sont là
        script: |
          set -e
          if [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles --project "$XCODE_PROJECT"
            echo "SIGNING=yes" >> "$CM_ENV"
          else
            echo "Pas de clé App Store Connect : compilation sans signature."
            echo "SIGNING=no" >> "$CM_ENV"
          fi

      # Compilation : avec ou sans signature selon les certificats.
      # Sans signature : .app compilé dans build/ios/Release-iphoneos/
      # Avec signature : .ipa dans build/ios/ipa/
      - name: Compiler
        script: |
          set -e
          if [ "${SIGNING:-no}" = "yes" ]; then
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          else
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
            # Copie le .app à la racine pour l'artifact
            cp -r "$CM_BUILD_DIR/build/ios/Release-iphoneos/ubear.app" "$CM_BUILD_DIR/"
          fi

    # Fichiers conservés après le build et téléchargeables depuis Codemagic.
    artifacts:
      - ubear.app                    # Sans signature
      - build/ios/ipa/*.ipa          # Avec signature (si certificats)
      - /tmp/xcodebuild_logs/*.log

    # -------------------------------------------------------------------------
    # Publication (optionnel : App Store Connect)
    # -------------------------------------------------------------------------
    # Décommente et configure si tu veux pousser automatiquement vers TestFlight.
    # publishing:
    #   app_store_connect:
    #     auth: integration              # utilise une clé App Store Connect
    #     submit_to_testflight: true     # Envoyer à TestFlight
    #     submit_to_app_store: false     # Ne pas soumettre à l'App Store

    #     # "Distribute to beta groups" : décoché par défaut.
    #     # Pour l'activer, décommente et indique le nom du groupe TestFlight :
    #     # beta_groups:
    #     #   - Nom du groupe

    #   # "Notifications" : pour recevoir un email à la fin de chaque build :
    #   email:
    #     recipients:
    #       - ton@email.com
    #     notify:
    #       success: true
    #       failure: true
