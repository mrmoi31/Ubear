# Compilation iOS d'Ubear sur Codemagic.
# Le dépôt Git doit avoir ce fichier à sa racine (le dossier ubear-mobile).
#
# Sans certificat : on obtient une .app non signée.
# Avec une intégration App Store Connect dans l'interface Codemagic
# (clé API, certificat iOS, profil pour com.ubear.game) : on obtient une .ipa.
workflows:
  ubear-ios:
    name: Ubear iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      xcode: latest
      vars:
        BUNDLE_ID: com.ubear.game
        XCODE_PROJECT: build/ios/ubear.xcodeproj
        XCODE_SCHEME: ubear
      # Décommente après avoir ajouté l'intégration App Store Connect dans Codemagic.
      # ios_signing:
      #   distribution_type: app_store
      #   bundle_identifier: com.ubear.game
    scripts:
      - name: Outils
        script: |
          set -e
          brew list cmake >/dev/null 2>&1 || brew install cmake
          cmake --version
          xcodebuild -version
      - name: Projet Xcode
        script: |
          set -e
          cmake -G Xcode -S "$CM_BUILD_DIR" -B "$CM_BUILD_DIR/build/ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=12.0 \
            -DCMAKE_BUILD_TYPE=Release
          xcodebuild -project "$XCODE_PROJECT" -list
      - name: Signature si les certificats sont là
        script: |
          set -e
          if [ -n "${APP_STORE_CONNECT_ISSUER_ID:-}" ]; then
            keychain initialize
            app-store-connect fetch-signing-files "$BUNDLE_ID" --type IOS_APP_STORE --create
            keychain add-certificates
            xcode-project use-profiles --project "$XCODE_PROJECT"
            echo "SIGNING=yes" >> "$CM_ENV"
          else
            echo "Pas de clé App Store Connect : compilation sans signature."
            echo "SIGNING=no" >> "$CM_ENV"
          fi
      - name: Compiler
        script: |
          set -e
          if [ "${SIGNING:-no}" = "yes" ]; then
            xcode-project build-ipa --project "$XCODE_PROJECT" --scheme "$XCODE_SCHEME"
          else
            xcodebuild \
              -project "$XCODE_PROJECT" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -sdk iphoneos \
              -destination "generic/platform=iOS" \
              -derivedDataPath "$CM_BUILD_DIR/build/ios/DerivedData" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM=""
          fi
    artifacts:
      - build/ios/**/*.app
      - build/ios/**/*.ipa
      - build/ios/DerivedData/**/*.app
      - build/ios/ipa/*.ipa
